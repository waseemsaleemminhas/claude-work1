<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ironclad Tech - intro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Standalone intro. Open it and hit Replay, or drive it from a capture script
   via window.playIntro(). For an alpha export set --stage to "transparent"
   and record with an alpha-capable codec. Total run time 2.4s. */
:root{--stage:#05101F;--gold:#D4AF37;--gold-dim:#C9B37E;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--stage);display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',ui-monospace,monospace}
.lock-stack{display:flex;flex-direction:column;align-items:center;gap:18px}
.wm-stack{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:52px;color:#fff;letter-spacing:.015em;line-height:1}
.techline{display:flex;align-items:center;gap:14px;width:100%;max-width:360px}
.techline .rule{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.techline .rule.r{background:linear-gradient(90deg,var(--gold),transparent)}
.techline span{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500;font-size:19px;letter-spacing:.44em;text-indent:.44em;color:var(--gold)}
.tagfix{font-weight:500;font-size:13px;letter-spacing:.165em;text-transform:uppercase;color:var(--gold-dim);text-align:center}
.btn{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  font-family:inherit;font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;
  color:#F2D778;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.42);
  border-radius:6px;padding:11px 18px;cursor:pointer;min-height:44px}
.btn:hover,.btn:focus-visible{background:var(--gold);color:#07162A;outline:none}
#intro .ishield{stroke-dasharray:1000;stroke-dashoffset:0}
#intro .igold{opacity:1}
#intro .imono{opacity:1;transform:none;transform-origin:60px 70px}
#intro .isweep{opacity:0}
#intro .iwm{opacity:1;letter-spacing:.015em}
#intro .itag{opacity:1}
#intro .itech{opacity:1}
#intro .ihalo{position:absolute;inset:-34px;border-radius:50%;opacity:0;
  background:radial-gradient(circle,rgba(212,175,55,.26) 0%,transparent 70%)}
#intro .istage{position:relative;display:grid;place-items:center}
#intro.play .ishield{animation:draw 560ms cubic-bezier(.5,0,.2,1) both}
#intro.play .igold{animation:flood 400ms ease-out 390ms both,molten 620ms ease-out 390ms both}
#intro.play .imono{animation:stamp 360ms cubic-bezier(.3,1.5,.4,1) 720ms both}
#intro.play .isweep{animation:sweep 700ms cubic-bezier(.4,0,.3,1) 940ms both}
#intro.play .ihalo{animation:haloin 500ms ease 300ms both,halohit 420ms cubic-bezier(.2,.8,.3,1) 720ms both}
#intro.play .iwm{animation:track 500ms cubic-bezier(.22,.9,.25,1) 1020ms both}
#intro.play .itech{animation:fadeup 400ms ease-out 1280ms both}
#intro.play .itag{animation:fadeup 400ms ease-out 1460ms both}
@keyframes draw{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes flood{from{opacity:0;clip-path:inset(100% 0 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes molten{0%{filter:drop-shadow(0 0 0 rgba(244,211,94,0))}45%{filter:drop-shadow(0 0 16px rgba(244,211,94,.85))}100%{filter:drop-shadow(0 0 4px rgba(212,175,55,.25))}}
@keyframes haloin{to{opacity:1}}
@keyframes halohit{0%{transform:scale(1)}35%{transform:scale(1.5);opacity:.95}100%{transform:scale(1);opacity:.6}}
@keyframes stamp{from{opacity:0;transform:scale(1.55)}to{opacity:1;transform:scale(1)}}
@keyframes sweep{from{opacity:.95;transform:translateX(-45px) skewX(-16deg)}65%{opacity:.95}to{opacity:0;transform:translateX(140px) skewX(-16deg)}}
@keyframes track{from{opacity:0;letter-spacing:.42em}to{opacity:1;letter-spacing:.015em}}
@keyframes fadeup{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#intro.play *{animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gChrome" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6E6B66"/><stop offset=".18" stop-color="#DEDEDC"/>
    <stop offset=".38" stop-color="#8A8783"/><stop offset=".58" stop-color="#F2F2F0"/>
    <stop offset=".78" stop-color="#7C7974"/><stop offset="1" stop-color="#4E4C48"/>
  </linearGradient>
  <linearGradient id="gField" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#32322F"/><stop offset="1" stop-color="#121110"/>
  </linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#7A6228"/><stop offset=".34" stop-color="#C9A43F"/>
    <stop offset=".52" stop-color="#F6EBB4"/><stop offset=".63" stop-color="#D9B85C"/>
    <stop offset="1" stop-color="#6B5120"/>
  </linearGradient>
  <linearGradient id="gFlat" x1="0" y1="0" x2=".35" y2="1">
    <stop offset="0" stop-color="#E8CE72"/><stop offset=".5" stop-color="#D4AF37"/>
    <stop offset="1" stop-color="#B08E22"/>
  </linearGradient>
  <linearGradient id="gSweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cShield"><path d="M10 14 H110 A4 4 0 0 1 114 18 V66 C114 100 94 124 60 136 C26 124 6 100 6 66 V18 A4 4 0 0 1 10 14 Z"/></clipPath>

  <symbol id="mkFaithful" viewBox="0 0 120 140">
    <path d="M10 14 H110 A4 4 0 0 1 114 18 V66 C114 100 94 124 60 136 C26 124 6 100 6 66 V18 A4 4 0 0 1 10 14 Z" fill="url(#gChrome)"/>
    <path d="M18 23 H102 A2 2 0 0 1 104 25 V66 C104 93 88 113 60 123 C32 113 16 93 16 66 V25 A2 2 0 0 1 18 23 Z" fill="url(#gField)"/>
    <path d="M27 34 H53 V46 H45 V84 H51 V95 H29 V84 H35 V46 H27 Z" fill="url(#gGold)"/>
    <path d="M57 34 H93 V46 H81 V104 H69 V46 H57 Z" fill="url(#gGold)"/>
  </symbol>
  <symbol id="mkFlat" viewBox="0 0 120 140">
    <path fill-rule="evenodd" fill="url(#gFlat)" d="M10 14 H110 A4 4 0 0 1 114 18 V66 C114 100 94 124 60 136 C26 124 6 100 6 66 V18 A4 4 0 0 1 10 14 Z M20 25 H100 V66 C100 91 86 109 60 118 C34 109 20 91 20 66 Z"/>
    <path d="M27 34 H53 V46 H45 V84 H51 V95 H29 V84 H35 V46 H27 Z" fill="url(#gFlat)"/>
    <path d="M57 34 H93 V46 H81 V104 H69 V46 H57 Z" fill="url(#gFlat)"/>
  </symbol>
  <symbol id="mkMono" viewBox="0 0 120 140">
    <path fill-rule="evenodd" fill="currentColor" d="M10 14 H110 A4 4 0 0 1 114 18 V66 C114 100 94 124 60 136 C26 124 6 100 6 66 V18 A4 4 0 0 1 10 14 Z M20 25 H100 V66 C100 91 86 109 60 118 C34 109 20 91 20 66 Z"/>
    <path fill="currentColor" d="M27 34 H53 V46 H45 V84 H51 V95 H29 V84 H35 V46 H27 Z"/>
    <path fill="currentColor" d="M57 34 H93 V46 H81 V104 H69 V46 H57 Z"/>
  </symbol>
  <symbol id="mkFav" viewBox="0 0 120 140">
    <path fill-rule="evenodd" fill="#D4AF37" d="M10 14 H110 A4 4 0 0 1 114 18 V66 C114 100 94 124 60 136 C26 124 6 100 6 66 V18 A4 4 0 0 1 10 14 Z M22 36 H52 V50 H44 V86 H52 V100 H22 V86 H30 V50 H22 Z M58 36 H98 V50 H82 V108 H66 V50 H58 Z"/>
  </symbol>
  <symbol id="mkPlaceholder" viewBox="0 0 120 140">
    <path d="M60 6 L110 24 V64 C110 100 88 122 60 134 C32 122 10 100 10 64 V24 Z" fill="none" stroke="#D4AF37" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="60" cy="55" r="15" fill="#D4AF37"/>
    <path d="M35 97 C35 78 46 70 60 70 C74 70 85 78 85 97 Z" fill="#D4AF37"/>
  </symbol>
</defs></svg>
<div class="lock-stack" id="intro">
  <div class="istage"><div class="ihalo"></div><svg viewBox="0 0 120 140" width="154" height="180" style="overflow:visible;flex:0 0 auto" role="img" aria-label="Ironclad Tech">
    <path class="ishield" pathLength="1000" fill="none" stroke="#D4AF37" stroke-width="3" stroke-linejoin="round" d="M10 14 H110 A4 4 0 0 1 114 18 V66 C114 100 94 124 60 136 C26 124 6 100 6 66 V18 A4 4 0 0 1 10 14 Z"/>
    <path class="igold" fill-rule="evenodd" fill="url(#gFlat)" d="M10 14 H110 A4 4 0 0 1 114 18 V66 C114 100 94 124 60 136 C26 124 6 100 6 66 V18 A4 4 0 0 1 10 14 Z M20 25 H100 V66 C100 91 86 109 60 118 C34 109 20 91 20 66 Z"/>
    <g class="imono">
      <path fill="url(#gFlat)" d="M27 34 H53 V46 H45 V84 H51 V95 H29 V84 H35 V46 H27 Z"/>
      <path fill="url(#gFlat)" d="M57 34 H93 V46 H81 V104 H69 V46 H57 Z"/>
    </g>
    <g clip-path="url(#cShield)"><rect class="isweep" x="0" y="-25" width="26" height="195" fill="url(#gSweep)"/></g>
  </svg></div>
  <span class="wm-stack iwm">IRONCLAD</span>
  <span class="techline itech"><span class="rule"></span><span>TECH</span><span class="rule r"></span></span>
  <span class="tagfix itag">Built on Trust. Powered by Technology.</span>
</div>
<button class="btn" id="replay" type="button">Replay</button>
<script>
(function(){
  var intro = document.getElementById('intro'), btn = document.getElementById('replay');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function play(){
    if (reduce) return;
    intro.classList.remove('play');
    void intro.offsetWidth;
    intro.classList.add('play');
  }
  btn.addEventListener('click', play);
  window.playIntro = play;
  if (!reduce) setTimeout(play, 300);
})();
</script>
</body></html>
